version: "3.8"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=student_portal
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  web:
    build:
      context: .
    command: /app/entrypoint.sh
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

  nginx:
    image: nginx:stable
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - ./compose/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
